<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Intentionally invisible: Android 12+ caps the system splash icon at a small circle, so the
     system splash only shows the background colour and MainPage shows the full artwork for 2 s. -->
<svg width="100" height="100" viewBox="0 0 100 100" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="100" height="100" fill="#000C08" fill-opacity="0" />
</svg>
