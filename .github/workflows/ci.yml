name: Release AuraMusic APK

# Started by hand only (Actions › Release AuraMusic APK › Run workflow, on main): the Kernel tests, then
# the signed APK attached to a new GitHub release, which the app offers to every phone at its next launch.
# The version is the one written in AuraMusic.Mobile.csproj: raise it there, in a pull request, first.
# Warnings fail the build, so "0 warning" is checked here rather than by eye.
on:
  workflow_dispatch:

# Two releases must never race for the same phones.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  kernel:
    name: Kernel tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-kernel-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-kernel-

      - name: Build
        run: dotnet build tests/AuraMusic.Kernel.Tests -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test --project tests/AuraMusic.Kernel.Tests --no-build

  release:
    name: Release
    needs: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # Before the long build: a release only comes from main, under the csproj's version, which must be new.
      - name: Check the branch and read the version
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are only cut from main, not from $GITHUB_REF_NAME."
            exit 1
          fi
          VERSION=$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' src/AuraMusic.Mobile/AuraMusic.Mobile.csproj)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ApplicationDisplayVersion '$VERSION' is not a version like 1.7.0."
            exit 1
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1 || [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "::error::v$VERSION is already published: raise ApplicationDisplayVersion in AuraMusic.Mobile.csproj."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-android-

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install the Android SDK components
        run: >
          dotnet build src/AuraMusic.Mobile -f net11.0-android -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true

      # Every release must be signed with the same key, or phones refuse to install the update.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/auramusic.keystore"
          if [ ! -s "$RUNNER_TEMP/auramusic.keystore" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing or empty."
            exit 1
          fi

      # Android only installs an update whose version code is higher. The former release workflow counted
      # up to 12; this workflow's own run numbers start over, hence the offset.
      - name: Build the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          dotnet publish src/AuraMusic.Mobile -f net11.0-android -c Release -o publish
          -p:TreatWarningsAsErrors=true
          -p:AndroidPackageFormat=apk
          -p:ApplicationVersion=$((GITHUB_RUN_NUMBER + 100))
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/auramusic.keystore"
          -p:AndroidSigningKeyAlias=mafyou
          -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD
          -p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD

      # Creates the tag on the commit that was built, and the release with it.
      - name: Create the GitHub release
        run: |
          apk="AuraMusic-v$VERSION.apk"
          cp publish/fr.mafyou.auramusic-Signed.apk "$apk"
          checksum=$(sha256sum "$apk" | cut -d' ' -f1)
          gh release create "v$VERSION" "$apk" --target "$GITHUB_SHA" \
            --title "AuraMusic v$VERSION" --generate-notes \
            --notes "SHA-256 (\`$apk\`): \`$checksum\`"
