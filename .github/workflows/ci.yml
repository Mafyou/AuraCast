name: Release AuraMusic APK

# Every push to main and every pull request: the Kernel tests, and the Android app must still build.
# Warnings fail the build, so "0 warning" is checked here rather than by eye.
# A tag like v1.0.0 on main: the tests, then the signed APK attached to a GitHub release,
# which the app offers to every phone at its next launch.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# A newer push replaces the run of an older one, but a release is never cut short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  kernel:
    name: Kernel tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-kernel-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-kernel-

      - name: Build
        run: dotnet build tests/AuraMusic.Kernel.Tests -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test --project tests/AuraMusic.Kernel.Tests --no-build

  android:
    name: Android build
    # A tag builds the app in the release job instead.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-android-

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install the Android SDK components
        run: >
          dotnet build src/AuraMusic.Mobile -f net11.0-android -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true

      # Release configuration: it is the one that ships, and the one where the update check is compiled in.
      - name: Build the app
        run: dotnet build src/AuraMusic.Mobile -f net11.0-android -c Release -p:TreatWarningsAsErrors=true

  release:
    name: Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, to check where the tag sits

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main: releases are only cut from main."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-android-

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install the Android SDK components
        run: >
          dotnet build src/AuraMusic.Mobile -f net11.0-android -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true

      # Every release must be signed with the same key, or phones refuse to install the update.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/auramusic.keystore"
          if [ ! -s "$RUNNER_TEMP/auramusic.keystore" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing or empty."
            exit 1
          fi

      # Android only installs an update whose version code is higher. The former release workflow counted
      # up to 12; this workflow's own run numbers start over, hence the offset.
      - name: Build the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          dotnet publish src/AuraMusic.Mobile -f net11.0-android -c Release -o publish
          -p:TreatWarningsAsErrors=true
          -p:AndroidPackageFormat=apk
          -p:ApplicationDisplayVersion="${GITHUB_REF_NAME#v}"
          -p:ApplicationVersion=$((GITHUB_RUN_NUMBER + 100))
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/auramusic.keystore"
          -p:AndroidSigningKeyAlias=mafyou
          -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD
          -p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="AuraMusic-$GITHUB_REF_NAME.apk"
          cp publish/fr.mafyou.auramusic-Signed.apk "$apk"
          checksum=$(sha256sum "$apk" | cut -d' ' -f1)
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "AuraMusic $GITHUB_REF_NAME" --generate-notes \
            --notes "SHA-256 (\`$apk\`): \`$checksum\`"
