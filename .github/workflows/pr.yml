name: Pull request checks

# Every pull request: the Kernel tests, and the Android app must still build. The protection of main
# requires both jobs by name ("Kernel tests", "Android build") before a merge.
# Warnings fail the build, so "0 warning" is checked here rather than by eye.
on:
  pull_request:

# A newer push to the pull request replaces the run of the older one.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel:
    name: Kernel tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Every change ships under its own number: the release workflow tags the csproj's version, so a pull
      # request that leaves it on an already published one could not be released. Checked in this job
      # because the protection of main requires it.
      - name: Check the version was raised
        run: |
          VERSION=$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' src/AuraMusic.Mobile/AuraMusic.Mobile.csproj)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ApplicationDisplayVersion '$VERSION' is not a version like 1.7.0."
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "::error::v$VERSION is already published: raise ApplicationDisplayVersion in src/AuraMusic.Mobile/AuraMusic.Mobile.csproj."
            exit 1
          fi
          echo "This pull request will ship as v$VERSION."

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-kernel-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-kernel-

      - name: Build
        run: dotnet build tests/AuraMusic.Kernel.Tests -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test --project tests/AuraMusic.Kernel.Tests --no-build

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-android-

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install the Android SDK components
        run: >
          dotnet build src/AuraMusic.Mobile -f net11.0-android -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true

      # Release configuration: it is the one that ships, and the one where the update check is compiled in.
      - name: Build the app
        run: dotnet build src/AuraMusic.Mobile -f net11.0-android -c Release -p:TreatWarningsAsErrors=true
