name: Release

# Push a tag like v1.0.0 on main: tests run, the APK is built, signed and attached to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install the Android SDK components
        run: >
          dotnet build src/AuraCast.Mobile -f net11.0-android -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true

      - name: Test
        run: dotnet test --project tests/AuraCast.Kernel.Tests

      # Every release must be signed with the same key, or phones refuse to install the update.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/auracast.keystore"
          if [ ! -s "$RUNNER_TEMP/auracast.keystore" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing or empty."
            exit 1
          fi

      - name: Build the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          dotnet publish src/AuraCast.Mobile -f net11.0-android -c Release -o publish
          -p:AndroidPackageFormat=apk
          -p:ApplicationDisplayVersion="${GITHUB_REF_NAME#v}"
          -p:ApplicationVersion=${{ github.run_number }}
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/auracast.keystore"
          -p:AndroidSigningKeyAlias=mafyou
          -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD
          -p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp publish/com.mafyou.auracast-Signed.apk "AuraMusic-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "AuraMusic-$GITHUB_REF_NAME.apk" \
            --title "AuraMusic $GITHUB_REF_NAME" --generate-notes
